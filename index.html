<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShortifyAI Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        .container {
            width: 100%;
            max-width: 400px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>🎬 ShortifyAI Dashboard</h2>
        <p>Загрузите ваше длинное видео, чтобы обрезать его в формат 9:16 и наложить автоматические субтитры.</p>
        <p style="color: gray; font-size: 14px; margin-top: 20px;">Нажмите кнопку внизу экрана, чтобы оформить Pro подписку.</p>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // Налаштовуємо і показуємо офіційну головну кнопку Telegram внизу екрана
        tg.MainButton.text = "Оформить Pro (100 ⭐)";
        tg.MainButton.show();

        // При натисканні на офіційну кнопку перенаправляємо на команду бота
        tg.MainButton.onClick(() => {
            window.location.href = "https://t.me/shortifyai_test_bot?start=pro";
        });
    </script>
</body>
</html>
